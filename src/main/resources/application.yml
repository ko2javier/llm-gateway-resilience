spring:
  application:
    name: llm-gateway

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework

groq:
  api:
    key: ${GROQ_API_KEY}
    base-url: https://api.groq.com/openai/v1
    # Groq retired llama-3.3-70b-versatile: since then every call answered
    # 404 model_not_found, the circuit breaker opened and the chat only
    # returned the fallback (seen on 2026-10-11). gpt-oss-120b was tested
    # end to end with this same image, weather tool included.
    # Groq retires models every few months. This value can be overridden
    # without rebuilding by setting GROQ_API_MODEL on the container (Spring
    # relaxed binding; checked with a temporary container on the VPS).
    model: openai/gpt-oss-120b

resilience4j:
  retry:
    instances:
      groqApi:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
      weatherApi:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException

  circuitbreaker:
    instances:
      groqApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      weatherApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers, circuitbreakerevents, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  